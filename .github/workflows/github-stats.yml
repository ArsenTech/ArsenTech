name: user-statistician

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [ main, master ]
    paths: [ '.github/workflows/github-stats.yml' ]
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v4
      with:
        ref: stats-output
        fetch-depth: 1

    - name: Generate the languages distribution
      uses: cicirello/user-statistician@v1
      with:
        image-file: languages.svg
        colors: dark-dimmed
        hide-keys: general, contributions, repositories
        commit-and-push: false
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: Generate the contributions stats
      uses: cicirello/user-statistician@v1
      with:
        image-file: stats.svg
        colors: dark-dimmed
        hide-keys: general, languages
        commit-and-push: false
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: Generate the languages distribution
      uses: cicirello/user-statistician@v1
      with:
        image-file: languages-light.svg
        colors: light
        hide-keys: general, contributions, repositories
        commit-and-push: false
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: Generate the contributions stats
      uses: cicirello/user-statistician@v1
      with:
        image-file: stats-light.svg
        colors: light
        hide-keys: general, languages
        commit-and-push: false
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        
    - name: Replace stats branch history
      shell: bash
      run: |
        set -euo pipefail
    
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    
        # Check whether the generated files changed
        git add -- \
          languages.svg \
          stats.svg \
          languages-light.svg \
          stats-light.svg
    
        if git diff --cached --quiet; then
          echo "No statistics changed."
          exit 0
        fi
    
        # Build a clean index containing only the four SVGs
        export GIT_INDEX_FILE="$(mktemp)"
        rm -f "$GIT_INDEX_FILE"
    
        git add -- \
          languages.svg \
          stats.svg \
          languages-light.svg \
          stats-light.svg
    
        TREE=$(git write-tree)
        COMMIT=$(echo "Update GitHub statistics from https://github.com/cicirello/user-statistician" | git commit-tree "$TREE")
    
        git push --force origin "$COMMIT:refs/heads/stats-output"
    
        rm -f "$GIT_INDEX_FILE"
